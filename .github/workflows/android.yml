# 광어 중계기 안드로이드 앱(APK)을 만들어 GitHub Releases에 올림.
# android/ 폴더가 바뀌거나, Actions 탭에서 직접 실행하면 동작.
name: Android APK

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # 같은 서명 키를 계속 써야 앱을 지우지 않고 업데이트할 수 있어서 키를 캐시에 보관
      - name: Restore signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: relay-debug-keystore-v1

      - name: Create signing key if missing
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey \
              -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Gwangeo Relay,O=Gwangeo,C=KR"
          fi

      - name: Build APK
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: gradle -p android assembleDebug --no-daemon

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk gwangeo-relay.apk
          gh release delete app --yes --cleanup-tag || true
          gh release create app gwangeo-relay.apk \
            --title "광어 중계기 안드로이드 앱 (빌드 ${{ github.run_number }})" \
            --notes "갤럭시에서 gwangeo-relay.apk 를 눌러 내려받아 설치하세요. 화면과 기능은 사이트에서 받아오므로 사이트가 바뀌면 앱도 자동으로 최신이 됩니다."
